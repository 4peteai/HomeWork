<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grey - {{ scenario.title }}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" href="/static/style.css">
    <script>
        window.SCENARIO_ID = "{{ scenario.id }}";
        window.SCENARIO_DATA = {{ scenario | tojson | safe }};
    </script>
</head>
<body>
    <div class="sticky-header">
        <div class="header-content">
            <div class="header-left">
                <a href="/" class="brand-title-link">
                    <h3 class="brand-title">🐘 Grey</h3>
                </a>
            </div>
            <select id="scenario-dropdown" class="scenario-dropdown">
                <option value="friday-favor" {% if scenario.id == 'friday-favor' %}selected{% endif %}>📅 Friday Favor</option>
                <option value="scope-change" {% if scenario.id == 'scope-change' %}selected{% endif %}>⚡ Scope Change Under Pressure</option>
                <option value="broken-promise" {% if scenario.id == 'broken-promise' %}selected{% endif %}>💔 Broken Promise</option>
                <option value="marketing-blocker" {% if scenario.id == 'marketing-blocker' %}selected{% endif %}>🚀 Security Blocker</option>
                <option value="uptime-standoff" {% if scenario.id == 'uptime-standoff' %}selected{% endif %}>💀 Uptime Standoff</option>
            </select>
            <div class="header-right">
                <div class="progress-widget">
                    <span class="progress-widget-label">PROGRESS</span>
                    <div class="progress-widget-bar">
                        <div id="progress-fill" class="progress-widget-fill" style="width: 0%"></div>
                    </div>
                    <span id="progress-percentage" class="progress-widget-percentage">0%</span>
                </div>
            </div>
        </div>
    </div>

    <div class="timeline-container">
        <div id="chat-timeline" class="chat-timeline">
        </div>
    </div>

    <div class="sticky-footer">
        <div class="footer-content">
            <textarea 
                id="user-input" 
                placeholder="Loading..." 
                rows="2"
            ></textarea>
            <button id="send-btn" onclick="sendMessage()"><span class="send-btn-text">Send</span></button>
        </div>
    </div>

    <!-- Completion Modal -->
    <div id="completion-modal" class="completion-modal" style="display: none;">
        <div id="debrief-card" class="debrief-card">
            <button class="modal-close-button" onclick="closeCompletionModal()" title="Close and review conversation">
                <span class="material-symbols-rounded">close</span>
            </button>
            <div class="debrief-header">
                <div class="debrief-icon-badge">
                    <span id="debrief-icon" class="material-symbols-rounded"></span>
                </div>
                <div class="debrief-header-text">
                    <h2 class="debrief-title">Scenario Complete</h2>
                    <p class="debrief-subtitle">You successfully navigated the conversation.</p>
                </div>
            </div>
            
            <div class="debrief-scoreboard">
                <div class="score-metric">
                    <div id="user-turns" class="score-value">5</div>
                    <div class="score-label">Your Turns</div>
                </div>
                <div class="score-divider"></div>
                <div class="score-metric">
                    <div id="par-score" class="score-value par">3</div>
                    <div class="score-label">Optimal Path</div>
                </div>
            </div>
            
            <div class="debrief-insight">
                <div class="insight-header">WINNING STRATEGY</div>
                <div class="insight-separator"></div>
                <p id="winning-explanation" class="insight-text"></p>
            </div>
            
            <div class="debrief-actions">
                <a href="/" class="debrief-button primary">Back to Menu</a>
                <button onclick="location.reload()" class="debrief-button secondary">Try Again (Beat Your Score)</button>
            </div>
        </div>
    </div>

    <script src="/static/scenario.js"></script>
</body>
</html>
